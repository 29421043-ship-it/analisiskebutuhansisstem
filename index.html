<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HelpDeskU | PT Nusantara Makmur Sejahtera</title>
<style>
:root{--bg:#fff8ea;--card:#fff;--ink:#3f3d56;--mut:#7a7890;--line:#eadfce;--pk:#f9bfcc;--yl:#ffdf8f;--gr:#bde8d3;--bl:#b8dcf3;--pu:#d0c8f7;--ac:#4f9a7a;--hd:#1f2937;--hdt:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1b2a;--card:#2a2840;--ink:#efedf8;--mut:#a9a6c0;--line:#3d3a58;--pk:#6b3a4b;--yl:#6b5a24;--gr:#27553f;--bl:#27506b;--pu:#443d7a;--ac:#7fd0a8;--hd:#12111b;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--hd);color:var(--hdt);padding:12px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header b{font-size:17px}header span{opacity:.7}
.sp{flex:1}.info{background:var(--yl);color:var(--ink);padding:6px 20px;font-size:13px}.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-bottom:16px}.act{font-size:13px;padding:6px 0;border-top:1px solid var(--line)}
select,input,textarea,button{font:inherit;color:var(--ink)}
select,input,textarea{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%}
header select{width:auto;background:#374151;color:#fff;border-color:#4b5563}
nav{display:flex;gap:6px;padding:14px 20px 0;flex-wrap:wrap}
nav button{border:0;background:var(--card);padding:8px 16px;border-radius:999px;cursor:pointer;border:1px solid var(--line)}
nav button.on{background:var(--pu);font-weight:600}
main{padding:16px 20px 40px;max-width:1100px;margin:auto}
h2{margin:6px 0 14px;font-size:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 2px 6px rgba(0,0,0,.05)}
.stat b{display:block;font-size:30px;line-height:1.1}.stat span{color:var(--mut);font-size:13px}
.bar{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:13px}.bar i{display:block;height:12px;border-radius:6px;background:var(--ac);min-width:4px}.bar em{width:112px;font-style:normal}
.tools{display:flex;gap:8px;margin-bottom:12px}.tools input{flex:1}.tools select{width:160px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:640px}
th{text-align:left;font-size:12px;color:var(--mut);padding:8px;text-transform:uppercase}
td{padding:10px 8px;border-top:1px solid var(--line)}tr.r{cursor:pointer}tr.r:hover{background:rgba(127,127,160,.1)}
.b{padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;color:#3f3d56;white-space:nowrap}
.s-Baru{background:var(--pk)}.s-Ditugaskan{background:var(--yl)}.s-Diproses{background:var(--bl)}.s-Menunggu{background:var(--pu)}.s-Selesai{background:var(--gr)}.s-Ditutup{background:#d7d7de}
.late{background:#e5484d;color:#fff}.p-Kritis{color:#e5484d;font-weight:700}.p-Tinggi{color:#d9822b;font-weight:600}
.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:8px 16px;cursor:pointer;font-weight:600}
.btn.o{background:var(--card);color:var(--ink);border:1px solid var(--line)}.btn.d{background:#e5484d}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-start;justify-content:center;padding:20px;overflow:auto;z-index:20}
#modal .card{width:100%;max-width:620px;margin:auto}
.log{border-left:3px solid var(--pu);padding:2px 0 2px 10px;margin:8px 0;font-size:13px}.log small{color:var(--mut)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--hd);color:#fff;padding:10px 18px;border-radius:12px;display:none;z-index:30}
@media(max-width:560px){.f2{grid-template-columns:1fr}}
</style></head><body>
<header><b>🎧 HELPDESKU</b><span>| PT Nusantara Makmur Sejahtera · Divisi Teknologi Informasi</span><div class="sp"></div>
<label style="margin:0;color:#cbd5e1">Masuk sebagai</label>
<select id="role" onchange="setRole(this.value)"><option value="user">Rina Kusuma · Staf Keuangan</option><option value="tech">Budi Santoso · Teknisi IT</option><option value="admin">Hendra Wijaya · Kepala IT (Admin)</option></select></header>
<div class="info">Jam layanan: Senin–Jumat 08.00–17.00 WIB · Ext. 1100 · helpdesk@nusantaramakmur.co.id · Gangguan kritis: hubungi Ext. 1199</div><nav id="nav"></nav><main id="app"></main><div id="modal" onclick="if(event.target===this)closeM()"></div><div id="toast"></div>
<script>
const ST=['Baru','Ditugaskan','Diproses','Menunggu','Selesai','Ditutup'];
const NEXT={Baru:[],Ditugaskan:['Diproses'],Diproses:['Menunggu','Selesai'],Menunggu:['Diproses'],Selesai:['Ditutup','Diproses'],Ditutup:[]};
const SLA={Kritis:4,Tinggi:8,Sedang:24,Rendah:72},TECH=['Budi','Sari','Dimas'],USERS={user:'Rina',tech:'Budi',admin:'Hendra'};
const CATS=['Jaringan','Perangkat Keras','Perangkat Lunak','Akun & Akses','Aplikasi','Lainnya'];
const H=36e5,now0=Date.now();
const DEPT={Rina:'Keuangan',Maya:'Keuangan',Dewi:'HRD',Lina:'HRD',Andi:'Operasional',Tono:'Operasional',Joko:'Marketing',Sinta:'Marketing',Fajar:'Gudang',Agus:'Gudang',Budi:'IT',Hendra:'IT'};
const PATH={Baru:[],Ditugaskan:['Ditugaskan'],Diproses:['Ditugaskan','Diproses'],Menunggu:['Ditugaskan','Diproses','Menunggu'],Selesai:['Ditugaskan','Diproses','Selesai'],Ditutup:['Ditugaskan','Diproses','Selesai','Ditutup']};
const NOTE={Diproses:'Mulai pengecekan dan diagnosa masalah.',Menunggu:'Menunggu spare part / konfirmasi pengguna.',Selesai:'Masalah teratasi. Mohon konfirmasi pengguna.',Ditutup:'Dikonfirmasi selesai oleh pengguna.'};
const mk=(n,title,cat,prio,by,as,st,ago,desc)=>{const c=now0-ago*H,l=[{t:c,w:by,x:'Tiket dibuat'}];let cur=c,prev='Baru';const gap=[.3,.7,2.5,4];
 PATH[st].forEach((x,i)=>{cur=Math.min(cur+gap[i]*H*(1+(n%3)*.4),now0-12e4);
  if(x==='Ditugaskan')l.push({t:cur,w:'Hendra',x:'Ditugaskan ke '+as});
  else{const w=x==='Ditutup'?by:as;l.push({t:cur,w,x:`Status: ${prev} → ${x}`});l.push({t:cur+6e4,w,x:NOTE[x]})}
  prev=x});
 return{id:'TKT-'+n,title,cat,prio,by,as,st,desc,created:c,log:l}};
const ROWS=[
['Email tidak bisa kirim lampiran lebih dari 10 MB','Aplikasi','Sedang','Maya','Sari','Ditutup',470,'Lampiran ditolak server dengan pesan ukuran terlalu besar.'],
['Monitor ruang rapat berkedip','Perangkat Keras','Sedang','Dewi','Dimas','Ditutup',440,'Layar berkedip saat dihubungkan ke laptop.'],
['Akun SAP terkunci setelah cuti','Akun & Akses','Tinggi','Rina','Budi','Ditutup',410,'Tidak bisa login setelah cuti seminggu.'],
['Instalasi Adobe Acrobat Pro','Perangkat Lunak','Rendah','Joko','Sari','Ditutup',380,'Dibutuhkan untuk menyunting kontrak PDF.'],
['Switch lantai 3 mati total','Jaringan','Kritis','Andi','Dimas','Ditutup',350,'Seluruh PC lantai 3 tidak mendapat jaringan.'],
['Printer gudang tidak terdeteksi','Perangkat Keras','Sedang','Fajar','Budi','Ditutup',320,'Printer label tidak muncul di daftar perangkat.'],
['Permintaan akun email karyawan baru','Akun & Akses','Rendah','Lina','Sari','Ditutup',300,'Karyawan baru bagian HRD mulai Senin.'],
['Laptop lambat dan sering hang','Perangkat Keras','Sedang','Sinta','Dimas','Ditutup',270,'Hang setiap membuka lebih dari 3 aplikasi.'],
['Aplikasi stok tidak bisa sinkron','Aplikasi','Tinggi','Agus','Budi','Ditutup',240,'Data stok gudang berbeda dengan sistem pusat.'],
['Sinyal WiFi lantai 2 lemah','Jaringan','Sedang','Dewi','Dimas','Ditutup',210,'Sering putus di area dekat pantry.'],
['Reset password VPN','Akun & Akses','Rendah','Tono','Sari','Ditutup',190,'Lupa password VPN untuk kerja dari luar kantor.'],
['Backup folder keuangan gagal','Aplikasi','Tinggi','Maya','Budi','Selesai',150,'Job backup malam error sejak dua hari lalu.'],
['Scanner tidak terbaca di PC baru','Perangkat Keras','Sedang','Lina','Sari','Ditutup',120,'Driver scanner tidak ditemukan.'],
['Tidak bisa akses folder bersama HRD','Akun & Akses','Tinggi','Dewi','Dimas','Selesai',96,'Muncul pesan access denied.'],
['Update antivirus gagal di 5 PC','Perangkat Lunak','Sedang','Joko','Budi','Menunggu',80,'Menunggu paket update dari vendor.'],
['Printer lantai 2 macet','Perangkat Keras','Sedang','Dewi','Sari','Diproses',50,'Kertas tersangkut dan lampu error menyala.'],
['Aplikasi absensi error 500','Aplikasi','Kritis','Andi','Dimas','Diproses',9,'Seluruh karyawan tidak dapat melakukan absen.'],
['Laptop tidak bisa terhubung WiFi','Jaringan','Tinggi','Rina','Budi','Diproses',5,'WiFi kantor terdeteksi tetapi gagal autentikasi sejak pagi.'],
['Proyektor ruang rapat tidak menampilkan gambar','Perangkat Keras','Tinggi','Sinta','Sari','Ditugaskan',4,'Rapat klien dimulai pukul 14.00.'],
['Instalasi Microsoft Office','Perangkat Lunak','Rendah','Rina','Budi','Selesai',30,'Butuh Office untuk laptop baru.'],
['Reset password email kantor','Akun & Akses','Rendah','Rina',null,'Baru',2,'Lupa password dan tidak bisa login ke webmail.'],
['VPN sering terputus','Jaringan','Tinggi','Joko',null,'Baru',1,'Koneksi VPN putus setiap 10 menit.'],
['CCTV gudang offline','Jaringan','Kritis','Agus',null,'Baru',.5,'Kamera 3 dan 4 tidak muncul di monitor keamanan.'],
['Permintaan penambahan RAM','Perangkat Keras','Rendah','Tono',null,'Baru',3,'PC sering penuh saat membuka file Excel besar.']];
let S={role:'user',tab:'dash',q:'',f:'',tickets:null};
try{const r=localStorage.getItem('hd_v2');if(r)S.tickets=JSON.parse(r)}catch(e){}
if(!S.tickets)S.tickets=ROWS.map((r,i)=>mk(241+i,...r));
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const save=()=>{try{localStorage.setItem('hd_v2',JSON.stringify(S.tickets))}catch(e){}};
const me=()=>USERS[S.role];
const vis=()=>S.role==='user'?S.tickets.filter(t=>t.by===me()):S.tickets;
const late=t=>!['Selesai','Ditutup'].includes(t.st)&&Date.now()-t.created>SLA[t.prio]*H;
const fd=ts=>new Date(ts).toLocaleString('id-ID',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
const badge=s=>`<span class="b s-${s}">${s}</span>`;
function toast(m){const e=$('#toast');e.textContent=m;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2200)}
function logT(t,x){t.log.push({t:Date.now(),w:me(),x})}
function setRole(r){S.role=r;if(r==='user'&&S.tab==='dash'){}render()}
function go(t){S.tab=t;render()}
function render(){
 $('#role').value=S.role;
 $('#nav').innerHTML=[['dash','Dashboard'],['list','Daftar Tiket'],['new','+ Buat Tiket']].map(([k,l])=>`<button class="${S.tab===k?'on':''}" onclick="go('${k}')">${l}</button>`).join('');
 $('#app').innerHTML=S.tab==='dash'?dash():S.tab==='list'?`<h2>Daftar Tiket</h2><div class="tools"><input id="q" placeholder="Cari nomor / judul / pelapor…" value="${esc(S.q)}" oninput="S.q=this.value;$('#tl').innerHTML=rows()"><select onchange="S.f=this.value;$('#tl').innerHTML=rows()"><option value="">Semua status</option>${ST.map(s=>`<option ${S.f===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="card tw"><table><thead><tr><th>No</th><th>Judul</th><th>Prioritas</th><th>Pelapor / Dept.</th><th>Teknisi</th><th>Status</th></tr></thead><tbody id="tl">${rows()}</tbody></table></div>`:form();
}
function rows(list){
 const q=S.q.toLowerCase();
 const l=(list||vis()).filter(t=>(!S.f||t.st===S.f)&&(!q||(t.id+t.title+t.by).toLowerCase().includes(q))).sort((a,b)=>b.created-a.created);
 return l.length?l.map(t=>`<tr class="r" onclick="openT('${t.id}')"><td><b>${t.id}</b></td><td>${esc(t.title)}<br><small style="color:var(--mut)">${t.cat} · ${fd(t.created)}</small></td><td class="p-${t.prio}">${t.prio}</td><td>${esc(t.by)}<br><small style="color:var(--mut)">${DEPT[t.by]||'-'}</small></td><td>${t.as||'—'}</td><td>${badge(t.st)} ${late(t)?'<span class="b late">Lewat SLA</span>':''}</td></tr>`).join(''):'<tr><td colspan="6" style="color:var(--mut)">Tidak ada tiket.</td></tr>';
}
function dash(){
 const v=vis(),c=s=>v.filter(t=>t.st===s).length,isOpen=t=>!['Selesai','Ditutup'].includes(t.st),mx=Math.max(1,...ST.map(c));
 const done=v.filter(t=>!isOpen(t)),ok=done.filter(t=>{const e=t.log.find(l=>/→ Selesai/.test(l.x));return e&&e.t-t.created<=SLA[t.prio]*H}).length,sla=done.length?Math.round(ok/done.length*100):100;
 const bars=(a,m)=>a.map(([l,n])=>`<div class="bar"><em>${l}</em><i style="width:${n/m*55}%"></i>${n}</div>`).join('');
 const cats=CATS.map(k=>[k,v.filter(t=>t.cat===k).length]),tech=TECH.map(k=>[k,v.filter(t=>t.as===k&&isOpen(t)).length]);
 const act=v.flatMap(t=>t.log.map(l=>({...l,id:t.id}))).sort((a,b)=>b.t-a.t).slice(0,6);
 const d=new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
 return `<h2 style="margin-bottom:2px">Selamat datang, ${me()}</h2><p style="margin:0 0 14px;color:var(--mut)">${d} · ${S.role==='user'?'Tiket yang Anda laporkan':'Seluruh tiket perusahaan'}</p><div class="grid">
 <div class="card stat"><b>${v.length}</b><span>Total tiket</span></div><div class="card stat"><b style="color:#d9822b">${v.filter(isOpen).length}</b><span>Masih terbuka</span></div>
 <div class="card stat"><b style="color:#3b82c4">${c('Diproses')}</b><span>Sedang diproses</span></div><div class="card stat"><b style="color:#e5484d">${v.filter(late).length}</b><span>Lewat SLA</span></div>
 <div class="card stat"><b style="color:#2f9e6e">${sla}%</b><span>Selesai sesuai SLA</span></div></div>
 <div class="g3"><div class="card"><b>Tiket per status</b>${bars(ST.map(s=>[s,c(s)]),mx)}</div><div class="card"><b>Tiket per kategori</b>${bars(cats,Math.max(1,...cats.map(x=>x[1])))}</div><div class="card"><b>Beban teknisi (aktif)</b>${bars(tech,Math.max(1,...tech.map(x=>x[1])))}<small style="color:var(--mut)">Belum ditugaskan: ${v.filter(t=>!t.as).length}</small></div></div>
 <div class="card tw" style="margin-bottom:16px"><b>Tiket terbaru</b><table><thead><tr><th>No</th><th>Judul</th><th>Prioritas</th><th>Pelapor / Dept.</th><th>Teknisi</th><th>Status</th></tr></thead><tbody>${rows(v).split('</tr>').slice(0,5).join('</tr>')}</tbody></table></div>
 <div class="card"><b>Aktivitas terbaru</b>${act.map(a=>`<div class="act"><small style="color:var(--mut)">${fd(a.t)} · ${a.id}</small><br><b>${esc(a.w)}</b>: ${esc(a.x)}</div>`).join('')}</div>`;
}
function form(){return `<h2>Buat Tiket Baru</h2><div class="card"><label>Judul masalah *</label><input id="ft" maxlength="80" placeholder="Contoh: Komputer tidak bisa menyala"><div class="f2"><div><label>Kategori</label><select id="fc">${CATS.map(c=>`<option>${c}</option>`).join('')}</select></div><div><label>Prioritas</label><select id="fp"><option>Rendah</option><option selected>Sedang</option><option>Tinggi</option><option>Kritis</option></select></div></div><label>Deskripsi *</label><textarea id="fd" rows="4" placeholder="Jelaskan masalah, kapan mulai terjadi, dan pesan error yang muncul"></textarea><div class="row"><button class="btn" onclick="createT()">Kirim Tiket</button></div><small style="color:var(--mut)">Target penyelesaian: Kritis 4 jam · Tinggi 8 jam · Sedang 24 jam · Rendah 72 jam.</small></div>`}
function createT(){
 const title=$('#ft').value.trim(),desc=$('#fd').value.trim();
 if(!title||!desc)return toast('Judul dan deskripsi wajib diisi');
 const n=Math.max(0,...S.tickets.map(t=>+t.id.slice(4)))+1,now=Date.now();
 S.tickets.push({id:'TKT-'+String(n).padStart(3,'0'),title,cat:$('#fc').value,prio:$('#fp').value,by:me(),as:null,st:'Baru',desc,created:now,log:[{t:now,w:me(),x:'Tiket dibuat'}]});
 save();S.tab='list';render();toast('Tiket berhasil dibuat');
}
function openT(id){
 const t=S.tickets.find(x=>x.id===id),adm=S.role==='admin',tech=S.role==='tech',staff=adm||tech;
 let acts='';
 if(adm)acts+=`<label>${t.as?'Pindahkan ke teknisi':'Tugaskan ke teknisi'}</label><select onchange="assign('${id}',this.value)"><option value="">Pilih teknisi…</option>${TECH.map(n=>`<option>${n}</option>`).join('')}</select>`;
 if(tech&&!t.as)acts+=`<div class="row"><button class="btn" onclick="assign('${id}','Budi')">Ambil tiket ini</button></div>`;
 const nx=NEXT[t.st].filter(s=>staff?(adm||t.as===me()):(t.st==='Selesai'));
 if(nx.length)acts+=`<label>Ubah status</label><div class="row">${nx.map(s=>`<button class="btn ${s==='Diproses'&&t.st==='Selesai'?'o':''}" onclick="setSt('${id}','${s}')">${t.st==='Selesai'&&s==='Diproses'?'Buka ulang':s==='Ditutup'&&!staff?'Tutup tiket':'→ '+s}</button>`).join('')}</div>`;
 else if(staff&&t.as&&t.as!==me()&&!adm)acts+=`<small style="color:var(--mut)">Tiket ini ditangani ${t.as}.</small>`;
 $('#modal').innerHTML=`<div class="card"><div class="row" style="margin-top:0;justify-content:space-between"><b>${t.id}</b><span>${badge(t.st)} ${late(t)?'<span class="b late">Lewat SLA</span>':''}</span></div><h2 style="margin:0 0 4px">${esc(t.title)}</h2><small style="color:var(--mut)">${t.cat} · Prioritas <span class="p-${t.prio}">${t.prio}</span> · Pelapor ${esc(t.by)} (${DEPT[t.by]||'-'}) · Teknisi ${t.as||'belum ada'}</small><p>${esc(t.desc)}</p>${acts}<label>Riwayat proses</label>${t.log.map(l=>`<div class="log"><small>${fd(l.t)} · ${esc(l.w)}</small><br>${esc(l.x)}</div>`).join('')}<label>Tambah catatan</label><input id="cm" placeholder="Tulis catatan tindak lanjut…"><div class="row"><button class="btn" onclick="addC('${id}')">Simpan catatan</button><button class="btn o" onclick="closeM()">Tutup</button>${adm?`<button class="btn d" onclick="del('${id}')">Hapus</button>`:''}</div></div>`;
 $('#modal').style.display='flex';
}
function closeM(){$('#modal').style.display='none'}
function assign(id,n){if(!n)return;const t=S.tickets.find(x=>x.id===id);t.as=n;if(t.st==='Baru')t.st='Ditugaskan';logT(t,'Ditugaskan ke '+n);save();render();openT(id);toast('Tiket ditugaskan ke '+n)}
function setSt(id,s){const t=S.tickets.find(x=>x.id===id);if(!NEXT[t.st].includes(s))return toast('Perubahan status tidak sesuai alur');logT(t,`Status: ${t.st} → ${s}`);t.st=s;save();render();openT(id)}
function addC(id){const v=$('#cm').value.trim();if(!v)return toast('Catatan masih kosong');const t=S.tickets.find(x=>x.id===id);logT(t,v);save();openT(id)}
function del(id){if(!confirm('Hapus tiket '+id+'?'))return;S.tickets=S.tickets.filter(x=>x.id!==id);save();closeM();render();toast('Tiket dihapus')}
render();
</script></body></html>
